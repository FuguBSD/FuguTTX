name: "Check: Code"

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - run: uv tool install rust-just
      - run: just check
      - if: github.event_name == 'pull_request'
        run: uv run python scripts/spec_check.py --drift "origin/${{ github.base_ref }}"
